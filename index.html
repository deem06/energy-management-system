<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - الاستهلاك</title>
    <style>
        :root { --sidebar-bg: #1a237e; --main-bg: #f8f9fa; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: var(--main-bg); }
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; height: 100vh; position: fixed; }
        .sidebar h2 { padding: 20px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar nav a { display: block; color: white; padding: 15px 20px; text-decoration: none; transition: 0.3s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); }
        .content { margin-right: 260px; padding: 40px; width: 100%; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .stat-box h3 { color: #666; margin-bottom: 10px; }
        .stat-box p { font-size: 32px; font-weight: bold; color: var(--sidebar-bg); margin: 0; }
        .lang-btn { float: left; cursor: pointer; background: #eee; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>نظام إدارة الطاقة</h2>
        <nav>
            <a href="dashboard.html" class="active">إحصائيات الاستهلاك</a>
            <a href="upload.html">إدخال البيانات</a>
            <a href="alerts.html">التنبيهات</a>
            <a href="recommendations.html">التوصيات</a>
            <a href="index.html" style="color: #ff8a80;">تسجيل الخروج</a>
        </nav>
    </div>
    <div class="content">
        <div class="lang-btn" onclick="alert('Language toggled')">English</div>
        <h1>إحصائيات الاستهلاك</h1>
        <div class="stats-grid">
            <div class="stat-box"><h3>الاستهلاك الشهري</h3><p>450 kWh</p></div>
            <div class="stat-box"><h3>المعدل اليومي</h3><p>15 kWh</p></div>
            <div class="stat-box"><h3>وقت الذروة</h3><p>02:00 PM</p></div>
        </div>
    </div>
</body>
</html>
