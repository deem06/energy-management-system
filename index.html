<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الطاقة</title>
    <style>
        :root { --primary: #1a237e; --secondary: #303f9f; --bg: #f5f5f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: var(--primary); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: var(--secondary); }
        .lang-switch { margin-top: 20px; font-size: 14px; color: var(--secondary); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="loginTitle">تسجيل الدخول</h2>
        <div class="input-group">
            <label id="userLabel">اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="input-group">
            <label id="passLabel">كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="location.href='dashboard.html'" id="loginBtn">دخول</button>
        <div class="lang-switch" onclick="toggleLang()" id="langBtn">English</div>
    </div>

    <script>
        function toggleLang() {
            const isAr = document.documentElement.dir === "rtl";
            document.documentElement.dir = isAr ? "ltr" : "rtl";
            document.documentElement.lang = isAr ? "en" : "ar";
            document.getElementById('loginTitle').innerText = isAr ? "Login" : "تسجيل الدخول";
            document.getElementById('userLabel').innerText = isAr ? "Username" : "اسم المستخدم";
            document.getElementById('passLabel').innerText = isAr ? "Password" : "كلمة المرور";
            document.getElementById('loginBtn').innerText = isAr ? "Login" : "دخول";
            document.getElementById('langBtn').innerText = isAr ? "العربية" : "English";
        }
    </script>
</body>
</html>
