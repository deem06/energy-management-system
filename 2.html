<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - إحصائيات الاستهلاك</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --sidebar-w: 260px; --primary: #003366; --bg: #f8f9fa; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: var(--bg); min-height: 100vh; }
        
        /* القائمة الجانبية */
        .sidebar { width: var(--sidebar-w); background: var(--primary); color: white; height: 100vh; position: fixed; }
        .sidebar h2 { padding: 25px 20px; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin: 0; }
        .sidebar nav a { display: block; color: white; padding: 15px 20px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); }
        
        /* المحتوى الرئيسي */
        .main-content { margin-right: var(--sidebar-w); padding: 40px; width: calc(100% - var(--sidebar-w)); }
        
        /* البطاقات الإحصائية */
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { color: #777; font-size: 14px; margin-bottom: 10px; }
        .stat-card p { font-size: 28px; font-weight: bold; color: var(--primary); margin: 0; }
        
        /* منطقة الرسم البياني */
        .chart-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        canvas { max-width: 100%; height: 350px !important; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .lang-btn { background: #eee; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 id="sideTitle">نظام الطاقة الذكي</h2>
        <nav>
            <a href="dashboard.html" class="active" id="link1">تحليل الاستهلاك</a>
            <a href="data.html" id="link2">إدارة البيانات</a>
            <a href="monitoring.html" id="link3">التنبيهات والأنماط</a>
            <a href="recommendations.html" id="link4">التوصيات الذكية</a>
            <a href="index.html" style="color: #ff9999;" id="link5" onclick="localStorage.clear()">خروج</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header-flex">
            <h1 id="mainTitle">تحليل وإحصائيات الاستهلاك</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="meterBadge" style="background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 14px;">عداد: ----</span>
                <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card"><h3 id="stat1">متوسط الاستهلاك</h3><p id="avgVal">0 kWh</p></div>
            <div class="stat-card"><h3 id="stat2">أعلى استهلاك</h3><p id="maxVal">0 kWh</p></div>
            <div class="stat-card"><h3 id="stat3">حالة الاستهلاك</h3><p id="status">جاري التحميل</p></div>
        </div>

        <div class="chart-box">
            <h3 id="chartTitle">متابعة الاستهلاك الشهري</h3>
            <canvas id="consumptionChart"></canvas>
        </div>
    </div>

    <script>
        // 1. جلب رقم العداد الجديد
        const currentMeter = localStorage.getItem('activeUser') || '102938';
        document.getElementById('meterBadge').innerText = "عداد: " + currentMeter;

        // 2. قاعدة بيانات الحسابات بالأرقام الجديدة
        const accountData = {
            "102938": { data: [420, 380, 450, 320, 410, 400], avg: "396", max: "450", status: "طبيعي", color: "#28a745" },
            "104756": { data: [800, 950, 1100, 1050, 1200, 1300], avg: "1066", max: "1300", status: "مرتفع جداً", color: "#dc3545" },
            "019283": { data: [200, 700, 150, 850, 100, 900], avg: "483", max: "900", status: "متذبذب", color: "#ffc107" },
            "017465": { data: [450, 460, 455, 470, 465, 460], avg: "460", max: "470", status: "تسريب محتمل", color: "#fd7e14" }
        };
        const currentData = accountData[currentMeter] || accountData["1111"];

        // 3. تحديث واجهة المستخدم بالبيانات
        document.getElementById('avgVal').innerText = currentData.avg + " kWh";
        document.getElementById('maxVal').innerText = currentData.max + " kWh";
        document.getElementById('status').innerText = currentData.status;
        document.getElementById('status').style.color = currentData.color;

        // 4. برمجة الرسم البياني
        const ctx = document.getElementById('consumptionChart').getContext('2d');
        const consumptionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
                datasets: [{
                    label: 'الاستهلاك بالـ kWh',
                    data: currentData.data,
                    borderColor: currentData.color,
                    backgroundColor: currentData.color + '1a', 
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });

        // 5. تغيير اللغة
        function toggleLang() {
            const isAr = document.documentElement.lang === 'ar';
            document.documentElement.lang = isAr ? 'en' : 'ar';
            document.documentElement.dir = isAr ? 'ltr' : 'rtl';

            document.getElementById('sideTitle').innerText = isAr ? "Smart Energy" : "نظام الطاقة الذكي";
            document.getElementById('mainTitle').innerText = isAr ? "Consumption Analysis" : "تحليل وإحصائيات الاستهلاك";
            document.getElementById('chartTitle').innerText = isAr ? "Monthly Monitoring" : "متابعة الاستهلاك الشهري";
            document.getElementById('langBtn').innerText = isAr ? "العربية" : "English";
            document.getElementById('stat1').innerText = isAr ? "Average Usage" : "متوسط الاستهلاك";
            document.getElementById('stat2').innerText = isAr ? "Peak Usage" : "أعلى استهلاك";
            document.getElementById('stat3').innerText = isAr ? "Usage Status" : "حالة الاستهلاك";
            
            document.getElementById('link1').innerText = isAr ? "Analysis" : "تحليل الاستهلاك";
            document.getElementById('link2').innerText = isAr ? "Data" : "إدارة البيانات";
            document.getElementById('link3').innerText = isAr ? "Alerts" : "التنبيهات والأنماط";
            document.getElementById('link4').innerText = isAr ? "Advice" : "التوصيات الذكية";
            document.getElementById('link5').innerText = isAr ? "Logout" : "خروج";

            consumptionChart.data.labels = isAr ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'] : ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'];
            consumptionChart.update();
        }
    </script>
</body>
</html>
