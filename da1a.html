<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المراقبة الفورية - طاقة ذكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; margin: 0; background: #f8f9fa; display: flex; }
        .sidebar { width: 260px; height: 100vh; background: #202124; color: white; position: fixed; padding: 20px; box-sizing: border-box; }
        .main-content { margin-right: 260px; padding: 40px; flex-grow: 1; }
        .nav-link { display: block; color: #bdc1c6; padding: 15px 10px; text-decoration: none; border-bottom: 1px solid #3c4043; }
        .status-card { padding: 25px; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; margin-top: 20px; display: flex; align-items: center; justify-content: center; min-height: 100px; }
        .danger { background: #d93025; box-shadow: 0 4px 15px rgba(217, 48, 37, 0.3); }
        .success { background: #1e8e3e; box-shadow: 0 4px 15px rgba(30, 142, 62, 0.3); }
        .warning { background: #f9ab00; box-shadow: 0 4px 15px rgba(249, 171, 0, 0.3); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: #1a73e8;">طاقة ذكية</h2>
        <a href="dashboard.html" class="nav-link">لوحة التحكم</a>
        <a href="data.html" class="nav-link">إدارة البيانات</a>
        <a href="monitoring.html" class="nav-link">المراقبة الفورية</a>
        <a href="recommendations.html" class="nav-link">نصائح التوفير</a>
    </div>

    <div class="main-content">
        <h3>حالة النظام المباشرة</h3>
        <p>يتم تحليل استهلاك العداد الحالي في الوقت الفعلي:</p>
        <div id="statusBox" class="status-card">جاري الفحص...</div>
    </div>

    <script>
        const user = localStorage.getItem('activeUser') || '1111';
        const box = document.getElementById('statusBox');

        if(user === '1111') {
            box.className = 'status-card success';
            box.innerText = '✅ حالة النظام: مستقرة. الاستهلاك ضمن الحدود الطبيعية.';
        } else if(user === '2222') {
            box.className = 'status-card danger';
            box.innerText = '⚠️ تنبيه حرج: تم رصد حمل زائد على الشبكة! يرجى تخفيف الاستهلاك.';
        } else if(user === '3333') {
            box.className = 'status-card warning';
            box.innerText = '🔸 ملاحظة: يوجد تذبذب في التيار الكهربائي غير منتظم.';
        } else {
            box.className = 'status-card warning';
            box.innerText = '🔍 فحص مطلوب: تم رصد استهلاك مستمر خلال ساعات الصباح الباكر.';
        }
    </script>
</body>
</html>
