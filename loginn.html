<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الطاقة الذكية - تسجيل الدخول</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { 
            color: #1a73e8; 
            margin-bottom: 10px; 
            font-weight: 700;
        }
        p {
            color: #5f6368;
            margin-bottom: 25px;
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s;
        }
        button:hover { 
            background: #1557b0; 
        }
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>بوابة الطاقة الذكية</h2>
        <p>يرجى إدخال بيانات العداد للوصول إلى لوحة التحكم</p>
        
        <input type="text" id="meterID" placeholder="رقم العداد">
        <input type="password" id="pass" placeholder="كلمة المرور">
        
        <button onclick="handleLogin()">تسجيل الدخول</button>
        
        <div class="footer-text">نظام إدارة الطاقة المتقدم © 2026</div>
    </div>

    <script>
        function handleLogin() {
            const meter = document.getElementById('meterID').value;
            const password = document.getElementById('pass').value;

            // الحسابات الأربعة (يمكنك تغيير الأرقام وكلمات المرور هنا)
            const users = {
                "1111": "p111",
                "2222": "p222",
                "3333": "p333",
                "4444": "p444"
            };

            if (users[meter] && users[meter] === password) {
                // حفظ رقم العداد في الذاكرة للانتقال للداشبورد
                localStorage.setItem('activeUser', meter);
                window.location.href = 'dashboard.html';
            } else {
                alert('عذراً! رقم العداد أو كلمة المرور غير صحيحة.');
            }
        }
    </script>
</body>
</html>
