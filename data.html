<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة البيانات - طاقة ذكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; margin: 0; background: #f8f9fa; display: flex; }
        .sidebar { width: 260px; height: 100vh; background: #202124; color: white; position: fixed; padding: 20px; box-sizing: border-box; }
        .main-content { margin-right: 260px; padding: 40px; flex-grow: 1; }
        .nav-link { display: block; color: #bdc1c6; padding: 15px 10px; text-decoration: none; border-bottom: 1px solid #3c4043; transition: 0.3s; }
        .nav-link:hover { color: white; background: #3c4043; border-radius: 5px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .upload-area { border: 2px dashed #1a73e8; padding: 40px; border-radius: 10px; background: #f1f8ff; cursor: pointer; margin-bottom: 20px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-family: 'Cairo'; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: #1a73e8;">طاقة ذكية</h2>
        <a href="dashboard.html" class="nav-link">لوحة التحكم</a>
        <a href="data.html" class="nav-link">إدارة البيانات</a>
        <a href="monitoring.html" class="nav-link">المراقبة الفورية</a>

        <div class="card">
            <h3>تحميل بيانات الطاقة</h3>
            <p>يمكنك رفع ملفات الاستهلاك بصيغة CSV أو إدخالها يدوياً لتحديث الرسم البياني.</p>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>اسحب الملف هنا أو اضغط للاختيار</p>
                <input type="file" id="fileInput" style="display:none" accept=".csv">
            </div>
            <button onclick="alert('تم رفع البيانات بنجاح!')">تحديث النظام</button>
        </div>
    </div>
