<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <link rel="stylesheet" href="style.css"> <style>

        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: var(--main-bg); }
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; height: 100vh; position: fixed; }
        .sidebar h2 { padding: 20px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar nav a { display: block; color: white; padding: 15px 20px; text-decoration: none; }
        .content { margin-right: 260px; padding: 40px; width: 100%; }
        .upload-area { background: white; padding: 50px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>نظام إدارة الطاقة</h2>
        <nav>
            <a href="dashboard.html">إحصائيات الاستهلاك</a>

        </nav>
    </div>

            <input type="file" accept=".csv">
            <br><br>
            <button style="padding: 10px 30px; background: #1a237e; color: white; border: none; border-radius: 4px; cursor: pointer;">رفع الملف</button>
        </div>
    </div>
</body>
</html>
